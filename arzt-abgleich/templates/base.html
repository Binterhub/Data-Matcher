<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ärzteabgleich{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}">Ärzteabgleich</a>
        {% if logged_in %}
        <nav>
            <a href="{{ url_for('dashboard') }}">Übersicht</a>
            <a href="{{ url_for('referenz') }}">Referenzliste</a>
            <a href="{{ url_for('upload_external') }}">Liste hochladen</a>
        </nav>
        <form method="post" action="{{ url_for('logout') }}" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <span class="who">{{ current_username }}</span>
            <button type="submit" class="button button-quiet">Abmelden</button>
        </form>
        {% endif %}
    </header>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="flash flash-{{ category }}">{{ message }}</p>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
