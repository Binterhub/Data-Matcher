<!DOCTYPE html>
<html lang="{{ g.lang }}" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Deutsche Wikipedia - Wissen für alle{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top bg-dark border-bottom border-body">
        <div class="container-fluid">
            <div class="ms-auto">
                <a href="{{ url_for('switch_language') }}" class="btn btn-outline-light">
                    <i class="fas fa-globe me-2"></i>
                    {% if g.lang == 'en' %}Deutsch{% else %}English{% endif %}
                </a>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
